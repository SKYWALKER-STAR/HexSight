services:
  backend:
    # Replace with your backend image name and tag.
    image: crpi-9jwlonaugv9hai08.cn-guangzhou.personal.cr.aliyuncs.com/snake-2001/hexsight-backend:latest
    env_file: ../.env
    environment:
      WEB_CONCURRENCY: '1'
    network_mode: host
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    restart: unless-stopped
