name: CD

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy backend with Docker Compose
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_COMPOSE_FILE: ${{ vars.DEPLOY_COMPOSE_FILE }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          BASTION_USER: ${{ vars.BASTION_USER }}
          BASTION_PORT: ${{ vars.BASTION_PORT || '22' }}
          BASTION_SSH_PRIVATE_KEY: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}
          BASTION_SSH_KNOWN_HOSTS: ${{ secrets.BASTION_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_COMPOSE_FILE SSH_PRIVATE_KEY SSH_KNOWN_HOSTS BASTION_HOST BASTION_USER BASTION_SSH_PRIVATE_KEY BASTION_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in repository Actions variables/secrets."
              exit 1
            fi
          done
          # Validate values before inserting them into the SSH configuration.
          for name in DEPLOY_HOST BASTION_HOST; do
            [[ "${!name}" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || { echo "::error::Invalid $name"; exit 1; }
          done
          for name in DEPLOY_USER BASTION_USER; do
            [[ "${!name}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]] || { echo "::error::Invalid $name"; exit 1; }
          done
          for name in DEPLOY_PORT BASTION_PORT; do
            [[ "${!name}" =~ ^[0-9]{1,5}$ ]] && (( 10#${!name} >= 1 && 10#${!name} <= 65535 )) || { echo "::error::Invalid $name"; exit 1; }
          done
          # Restrict the remote path so it can safely be passed through SSH.
          [[ "$DEPLOY_COMPOSE_FILE" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo '::error::Use an absolute Compose path without spaces.'; exit 1; }
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$BASTION_SSH_PRIVATE_KEY" > "$ssh_dir/bastion_key"
          printf '%s\n' "$BASTION_SSH_KNOWN_HOSTS" > "$ssh_dir/bastion_known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host bastion
            HostName $BASTION_HOST
            User $BASTION_USER
            Port $BASTION_PORT
            IdentityFile $ssh_dir/bastion_key
            UserKnownHostsFile $ssh_dir/bastion_known_hosts
          Host deployment
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile $ssh_dir/key
            UserKnownHostsFile $ssh_dir/known_hosts
            ProxyJump bastion
          Host *
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ForwardAgent no
          EOF
          chmod 600 "$ssh_dir"/*
          ssh -F "$ssh_dir/config" deployment "bash -se -- '$DEPLOY_COMPOSE_FILE'" <<'REMOTE'
          set -euo pipefail
          compose_file="$1"
          test -f "$compose_file"
          docker compose -f "$compose_file" config --quiet
          docker compose -f "$compose_file" pull backend
          docker compose -f "$compose_file" up -d --no-deps --wait --wait-timeout 120 backend
          docker compose -f "$compose_file" ps backend
          REMOTE
